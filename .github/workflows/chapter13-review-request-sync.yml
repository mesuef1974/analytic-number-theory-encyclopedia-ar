name: Chapter 13 review request sync

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Synchronize open review request
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'README.md': [
                  ('INDEPENDENT-REVIEW        = NOT YET STARTED',
                   'INDEPENDENT-REVIEW        = REQUESTED / ISSUE #23 / OPEN'),
              ],
              'docs/PROGRESS.md': [
                  ('- **حالة المراجعة المستقلة:** `NOT YET STARTED`',
                   '- **حالة المراجعة المستقلة:** `REQUESTED / ISSUE #23 / OPEN`'),
                  ('INDEPENDENT-REVIEW        = NOT YET STARTED',
                   'INDEPENDENT-REVIEW        = REQUESTED / ISSUE #23 / OPEN'),
                  ('1. إعداد حزمة المراجعة المستقلة للفصل الثالث عشر.\n2. تجميد الرأس المرشح للمراجعة بعد نجاح CI النهائي.\n3. فتح Issue للمراجعة الثانية المستقلة.\n4. إبقاء PR #22 غير مدمج حتى حكم المراجعة وأمر المالك الصريح.',
                   '1. حزمة المراجعة المستقلة مكتملة.\n2. الرأس `af0457207e73178831c815be9aa3f5c1cae10d34` مجمد للمراجعة.\n3. Issue #23 مفتوحة للمراجعة الثانية المستقلة.\n4. إبقاء PR #22 غير مدمج حتى الحكم وأمر المالك الصريح.'),
              ],
              'docs/VERSION.md': [
                  ('INDEPENDENT-REVIEW     = NOT YET STARTED',
                   'INDEPENDENT-REVIEW     = REQUESTED / ISSUE #23 / OPEN'),
              ],
              'docs/TODO.md': [
                  ('- [ ] إعداد حزمة المراجعة المستقلة.\n- [ ] تجميد رأس مرشح للمراجعة.\n- [ ] فتح Issue للمراجعة الثانية المستقلة.',
                   '- [x] إعداد حزمة المراجعة المستقلة.\n- [x] تجميد الرأس `af0457207e73178831c815be9aa3f5c1cae10d34`.\n- [x] فتح Issue #23 للمراجعة الثانية المستقلة.'),
                  ('REVIEW              = PENDING',
                   'REVIEW              = REQUESTED / ISSUE #23 / OPEN'),
              ],
              'docs/ROADMAP.md': [
                  ('- [ ] إعداد حزمة المراجعة المستقلة وتجميد رأس مرشح.\n- [ ] استلام حكم مستقل ورفع الفصل إلى `REVIEWED` إذا استوفى الشروط.',
                   '- [x] إعداد حزمة المراجعة المستقلة وتجميد الرأس `af0457207e73178831c815be9aa3f5c1cae10d34`.\n- [x] فتح Issue #23 للمراجعة الثانية المستقلة.\n- [ ] استلام حكم مستقل ورفع الفصل إلى `REVIEWED` إذا استوفى الشروط.'),
                  ('INDEPENDENT-REVIEW     = NOT YET STARTED',
                   'INDEPENDENT-REVIEW     = REQUESTED / ISSUE #23 / OPEN'),
              ],
          }

          changed = []
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new, 1)
                  elif new not in text:
                      raise SystemExit(f'{filename}: expected marker missing: {old!r}')
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(filename)

          print('Changed:', changed)
          PY

          if git diff --quiet; then
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/PROGRESS.md docs/VERSION.md docs/TODO.md docs/ROADMAP.md
          git commit -m "Record Chapter 13 independent review request"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
