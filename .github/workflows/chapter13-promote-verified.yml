name: Chapter 13 verified promotion

on:
  push:
    branches:
      - agent/chapter-13-bombieri-vinogradov-v0.17.0

permissions:
  contents: write

jobs:
  promote:
    if: ${{ !contains(github.event.head_commit.message, '[skip chapter13-promote]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/chapter-13-bombieri-vinogradov-v0.17.0
          fetch-depth: 0

      - name: Promote manuscript and synchronize result registry
        run: |
          python - <<'PY'
          from pathlib import Path

          chapter = Path('volumes/volume-01-foundations/chapters/chapter-13-bombieri-vinogradov.tex')
          text = chapter.read_text(encoding='utf-8')
          old = r'\noindent\textbf{حالة الفصل:} \textenglish{DRAFT}.'
          new = r'\noindent\textbf{حالة الفصل:} \textenglish{VERIFIED}.'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one chapter status marker, found {text.count(old)}')
          text = text.replace(old, new)
          old2 = r'\item لا تعني حالة \textenglish{DRAFT} أن الفصل اجتاز التحقق المرجعي'
          new2 = r'\item لا تعني حالة \textenglish{VERIFIED} أن الفصل اجتاز المراجعة المستقلة'
          if text.count(old2) != 1:
              raise SystemExit(f'Expected one closing status marker, found {text.count(old2)}')
          text = text.replace(old2, new2)
          chapter.write_text(text, encoding='utf-8')

          registry = Path('docs/RESULTS_REGISTRY.md')
          text = registry.read_text(encoding='utf-8')
          if 'ANT-THM-13-01' in text:
              raise SystemExit('Chapter 13 results already exist in central registry')

          rows = r'''| `ANT-THM-13-01` | حزمة الغربال الكبير للشخصيات: التربيعية والثنائية العظمى | الفصل 13 | `CITED / COMPOSITE-INPUT` | Bombieri (1965)؛ Montgomery--Vaughan II (2026)، المبرهنتان 19.16 و19.19 |
| `ANT-LEM-13-01` | هوية Vaughan | الفصل 13 | `PROVED-HERE` | برهان التفاف ديريشليه؛ تدقيق الهوية PASS |
| `ANT-PROP-13-01` | تفكيك مجاميع فون مانغولت إلى Type I وType II | الفصل 13 | `PROVED-HERE` | نتيجة من هوية Vaughan؛ تدقيق الدعم PASS |
| `ANT-LEM-13-02` | تقدير Type I | الفصل 13 | `PROVED-HERE` | Pólya--Vinogradov والجمع الجزئي؛ تدقيق Type I PASS |
| `ANT-LEM-13-03` | تقدير Type II | الفصل 13 | `PROVED-HERE` | المدخل الثنائي العظمى والتقسيم الديادي؛ تدقيق Type II PASS |
| `ANT-LEM-13-04` | متراجحة Pólya--Vinogradov للشخصيات البدائية | الفصل 13 | `PROVED-HERE` | تحويل فورييه المنتهي ومجاميع غاوس من الفصل 7 |
| `ANT-THM-13-02` | مبرهنة القيمة المتوسطة للشخصيات البدائية مع `sup_{y<=x}` | الفصل 13 | `PROVED-HERE` | هوية Vaughan وType I/II وحزمة الغربال الكبير المقتبسة |
| `ANT-THM-13-03` | مبرهنة Bombieri--Vinogradov في صيغة `psi` | الفصل 13 | `PROVED-HERE / INEFFECTIVE-CONSTANT` | القيمة المتوسطة ورد الموصلات وSiegel--Walfisz للصغار |
| `ANT-COR-13-01` | النسخة الموافقة لـ`theta` | الفصل 13 | `PROVED-HERE / INEFFECTIVE-CONSTANT` | ضبط القوى الأولية العليا من الفصل 9 |
| `ANT-COR-13-02` | النسخة الموافقة لـ`pi` | الفصل 13 | `PROVED-HERE / INEFFECTIVE-CONSTANT` | الجمع الجزئي من `ANT-COR-13-01` |
| `ANT-COR-13-03` | نتيجة تقريبًا كل الترديدات | الفصل 13 | `PROVED-HERE / INEFFECTIVE-CONSTANT` | متراجحة ماركوف من `ANT-THM-13-03` |'''

          marker = '\n## نتائج مؤجلة صراحة\n'
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one deferred-results marker, found {text.count(marker)}')
          text = text.replace(marker, '\n' + rows + '\n\n## نتائج مؤجلة صراحة\n')

          lines = []
          for line in text.splitlines():
              if line.startswith('| Bombieri--Vinogradov |'):
                  continue
              if line.startswith('الفصول من السابع إلى الثاني عشر بحالة'):
                  line = ('الفصول من السابع إلى الثالث عشر بحالة `REVIEWED` أو `VERIFIED` بحسب بوابة كل فصل. '
                          'الفصل الثالث عشر بحالة `VERIFIED` بعد إغلاق بوابة التأليف واجتياز التدقيق المنطقي والمرجعي '
                          'وفحوص الجودة والبناء؛ ولا تعني هذه الحالة `RELEASE-READY`.')
              lines.append(line)
          registry.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          for obsolete in (
              Path('docs/RESULTS_REGISTRY_CHAPTER_13.md'),
              Path('docs/CHAPTER_13_RESULTS_RESERVATION.md'),
          ):
              if obsolete.exists():
                  obsolete.unlink()
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Promote Chapter 13 to VERIFIED [skip chapter13-promote]"
          git push origin HEAD:agent/chapter-13-bombieri-vinogradov-v0.17.0
