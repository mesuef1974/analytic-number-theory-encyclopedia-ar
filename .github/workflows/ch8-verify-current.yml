name: Verify Chapter 8 current head

on:
  push:
    branches:
      - agent/chapter-08-dirichlet-primes-v0.12.0
    paths:
      - .github/workflows/ch8-verify-current.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out Chapter 8 branch
        uses: actions/checkout@v4
        with:
          ref: agent/chapter-08-dirichlet-primes-v0.12.0
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run repository quality checks
        run: python scripts/quality_check.py

      - name: Create build directory
        run: mkdir -p build

      - name: Compile verified PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: manuscript/main.tex
          latexmk_use_xelatex: true
          args: >-
            -interaction=nonstopmode
            -halt-on-error
            -file-line-error
            -outdir=build
          os: debian

      - name: Verify and fingerprint PDF
        shell: bash
        run: |
          test -s build/main.pdf
          cp build/main.pdf build/analytic-number-theory-encyclopedia-chapter-08-verified.pdf
          sha256sum build/analytic-number-theory-encyclopedia-chapter-08-verified.pdf > build/analytic-number-theory-encyclopedia-chapter-08-verified.pdf.sha256
          stat --printf='%s' build/analytic-number-theory-encyclopedia-chapter-08-verified.pdf > build/analytic-number-theory-encyclopedia-chapter-08-verified.pdf.size

      - name: Upload verified preview
        uses: actions/upload-artifact@v4
        with:
          name: chapter-08-verified-preview
          path: |
            build/analytic-number-theory-encyclopedia-chapter-08-verified.pdf
            build/analytic-number-theory-encyclopedia-chapter-08-verified.pdf.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Record verification and remove temporary workflow
        shell: bash
        run: |
          HEAD_BEFORE=$(git rev-parse HEAD)
          PDF_SHA=$(cut -d' ' -f1 build/analytic-number-theory-encyclopedia-chapter-08-verified.pdf.sha256)
          PDF_SIZE=$(cat build/analytic-number-theory-encyclopedia-chapter-08-verified.pdf.size)
          cat > docs/CHAPTER_08_CI_VERIFICATION_2026-07-19.md <<EOF
          # تحقق البناء النهائي للرأس الداخلي للفصل الثامن

          التاريخ: 2026-07-19

          - الرأس الذي جرى فحصه: \`${HEAD_BEFORE}\`
          - فحوص الجودة: \`PASS\`
          - بناء XeLaTeX/Biber الكامل: \`PASS\`
          - وجود ملف PDF غير فارغ: \`PASS\`
          - حجم PDF بالبايت: \`${PDF_SIZE}\`
          - SHA-256: \`${PDF_SHA}\`
          - الحالة العلمية بعد هذا التشغيل: \`VERIFIED\`
          - البوابة التالية: مراجعة ثانية مستقلة قبل \`REVIEWED\`.
          EOF
          rm -f .github/workflows/ch8-verify-current.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CHAPTER_08_CI_VERIFICATION_2026-07-19.md .github/workflows/ch8-verify-current.yml
          git commit -m 'ci(ch8): record verified build and clean runner'
          git push origin HEAD:agent/chapter-08-dirichlet-primes-v0.12.0
