name: Build encyclopedia PDF

on:
  push:
    branches: [main]
    paths:
      - "manuscript/**"
      - "volumes/**"
      - "figures/**"
      - "tables/**"
      - "scripts/build_named_indexes.py"
      - "scripts/check_latin_pdf_text.py"
      - "scripts/check_arabic_pdf_text.py"
      - "scripts/check_release_pdf_text.py"
      - "scripts/prepare_release_source.py"
      - ".github/workflows/build-book.yml"
  pull_request:
    branches: [main]
    paths:
      - "manuscript/**"
      - "volumes/**"
      - "figures/**"
      - "tables/**"
      - "scripts/build_named_indexes.py"
      - "scripts/check_latin_pdf_text.py"
      - "scripts/check_arabic_pdf_text.py"
      - "scripts/check_release_pdf_text.py"
      - "scripts/prepare_release_source.py"
      - ".github/workflows/build-book.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile draft and release PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create build directories and seed named indexes
        shell: bash
        run: |
          mkdir -p build/draft build/release
          for dir in build/draft build/release; do
            for name in people theorems symbols; do
              printf '\\begin{theindex}\n\\end{theindex}\n' > "$dir/$name.ind"
            done
          done

      - name: Compile auditable draft first pass
        uses: xu-cheng/latex-action@v4
        with:
          root_file: manuscript/main.tex
          latexmk_use_lualatex: true
          args: >-
            -interaction=nonstopmode
            -halt-on-error
            -file-line-error
            -outdir=build/draft
          os: debian

      - name: Diagnose draft build failure
        if: failure()
        shell: bash
        run: |
          echo "=== build/draft contents ==="
          find build/draft -maxdepth 1 -type f -printf '%f\n' | sort || true
          echo "=== tail of main.log ==="
          test -f build/draft/main.log && tail -n 250 build/draft/main.log || true
          echo "=== LaTeX error lines ==="
          test -f build/draft/main.log && grep -nE '^!|LaTeX Error|Package .* Error|Emergency stop|Fatal error' build/draft/main.log | tail -n 80 || true

      - name: Build UTF-8 named draft indexes
        shell: bash
        run: python scripts/build_named_indexes.py build/draft

      - name: Compile auditable draft with indexes
        uses: xu-cheng/latex-action@v4
        with:
          root_file: manuscript/main.tex
          latexmk_use_lualatex: true
          args: >-
            -interaction=nonstopmode
            -halt-on-error
            -file-line-error
            -outdir=build/draft
          os: debian

      - name: Prepare publication source
        shell: bash
        run: python scripts/prepare_release_source.py

      - name: Compile publication release first pass
        uses: xu-cheng/latex-action@v4
        with:
          root_file: build/release-src/manuscript/main.tex
          latexmk_use_lualatex: true
          args: >-
            -interaction=nonstopmode
            -halt-on-error
            -file-line-error
            -outdir=build/release
          os: debian

      - name: Build UTF-8 named release indexes
        shell: bash
        run: python scripts/build_named_indexes.py build/release

      - name: Compile publication release with indexes
        uses: xu-cheng/latex-action@v4
        with:
          root_file: build/release-src/manuscript/main.tex
          latexmk_use_lualatex: true
          args: >-
            -interaction=nonstopmode
            -halt-on-error
            -file-line-error
            -outdir=build/release
          os: debian

      - name: Verify both PDFs exist
        shell: bash
        run: |
          test -s build/draft/main.pdf
          test -s build/release/main.pdf
          echo "Draft and release PDFs generated successfully."
          stat --printf='Draft size: %s bytes\n' build/draft/main.pdf
          stat --printf='Release size: %s bytes\n' build/release/main.pdf
          file build/draft/main.pdf build/release/main.pdf

      - name: Extract PDF text
        shell: bash
        run: |
          command -v pdftotext >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          }
          pdftotext -layout build/draft/main.pdf build/draft/main-extracted.txt
          pdftotext -layout build/release/main.pdf build/release/main-extracted.txt

      - name: Verify draft preserves governance evidence
        shell: bash
        run: |
          grep -q 'REVIEWED' build/draft/main-extracted.txt
          grep -q 'docs/' build/draft/main-extracted.txt
          echo "DRAFT GOVERNANCE RETENTION: PASS"

      - name: Verify Latin PDF text integrity
        shell: bash
        run: |
          python scripts/check_latin_pdf_text.py build/draft/main-extracted.txt
          python scripts/check_latin_pdf_text.py build/release/main-extracted.txt

      - name: Verify Arabic PDF text searchability
        shell: bash
        run: |
          python scripts/check_arabic_pdf_text.py build/draft/main-extracted.txt
          python scripts/check_arabic_pdf_text.py build/release/main-extracted.txt

      - name: Verify publication metadata, references, and indexes
        shell: bash
        run: python scripts/check_release_pdf_text.py build/release/main-extracted.txt

      - name: Prepare named artifacts
        if: always()
        shell: bash
        run: |
          test -s build/draft/main.pdf && cp build/draft/main.pdf build/analytic-number-theory-encyclopedia-draft.pdf
          test -s build/release/main.pdf && cp build/release/main.pdf build/analytic-number-theory-encyclopedia-release.pdf
          test -s build/analytic-number-theory-encyclopedia-draft.pdf && sha256sum build/analytic-number-theory-encyclopedia-draft.pdf \
            > build/analytic-number-theory-encyclopedia-draft.pdf.sha256
          test -s build/analytic-number-theory-encyclopedia-release.pdf && sha256sum build/analytic-number-theory-encyclopedia-release.pdf \
            > build/analytic-number-theory-encyclopedia-release.pdf.sha256

      - name: Upload draft and release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytic-number-theory-encyclopedia-draft-and-release
          path: |
            build/analytic-number-theory-encyclopedia-draft.pdf
            build/analytic-number-theory-encyclopedia-draft.pdf.sha256
            build/analytic-number-theory-encyclopedia-release.pdf
            build/analytic-number-theory-encyclopedia-release.pdf.sha256
            build/draft/main.log
            build/draft/main-extracted.txt
            build/release/main.log
            build/release/main-extracted.txt
            build/release-src/RELEASE_SOURCE_GENERATED.txt
          if-no-files-found: warn
          retention-days: 30
