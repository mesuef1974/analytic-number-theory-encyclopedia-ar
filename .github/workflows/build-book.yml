name: Build encyclopedia PDF

on:
  push:
    branches:
      - main
      - agent/chapter-08-dirichlet-primes-v0.12.0
    paths:
      - "manuscript/**"
      - "volumes/**"
      - "figures/**"
      - "tables/**"
      - ".github/workflows/build-book.yml"
  pull_request:
    branches: [main]
    paths:
      - "manuscript/**"
      - "volumes/**"
      - "figures/**"
      - "tables/**"
      - ".github/workflows/build-book.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile XeLaTeX manuscript
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository quality checks
        run: python scripts/quality_check.py

      - name: Create build directory
        run: mkdir -p build

      - name: Compile with XeLaTeX and Biber
        uses: xu-cheng/latex-action@v4
        with:
          root_file: manuscript/main.tex
          latexmk_use_xelatex: true
          args: >-
            -interaction=nonstopmode
            -halt-on-error
            -file-line-error
            -outdir=build
          os: debian

      - name: Verify PDF exists
        shell: bash
        run: |
          test -s build/main.pdf
          echo "PDF generated successfully."
          stat --printf='Size: %s bytes\n' build/main.pdf
          file build/main.pdf

      - name: Prepare named preview
        shell: bash
        run: |
          cp build/main.pdf build/analytic-number-theory-encyclopedia-preview.pdf
          sha256sum build/analytic-number-theory-encyclopedia-preview.pdf \
            > build/analytic-number-theory-encyclopedia-preview.pdf.sha256

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: analytic-number-theory-encyclopedia-preview
          path: |
            build/analytic-number-theory-encyclopedia-preview.pdf
            build/analytic-number-theory-encyclopedia-preview.pdf.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Record Chapter 8 verification and restore canonical workflow
        if: github.ref == 'refs/heads/agent/chapter-08-dirichlet-primes-v0.12.0'
        shell: bash
        run: |
          HEAD_BEFORE=$(git rev-parse HEAD)
          PDF_SHA=$(cut -d' ' -f1 build/analytic-number-theory-encyclopedia-preview.pdf.sha256)
          PDF_SIZE=$(stat --printf='%s' build/analytic-number-theory-encyclopedia-preview.pdf)
          cat > docs/CHAPTER_08_CI_VERIFICATION_2026-07-19.md <<EOF
          # تحقق البناء للرأس الداخلي للفصل الثامن

          التاريخ: 2026-07-19

          - الرأس الذي جرى فحصه: \`${HEAD_BEFORE}\`
          - فحوص الجودة: \`PASS\`
          - بناء XeLaTeX/Biber الكامل: \`PASS\`
          - وجود ملف PDF غير فارغ: \`PASS\`
          - حجم PDF بالبايت: \`${PDF_SIZE}\`
          - SHA-256: \`${PDF_SHA}\`
          - حالة الفصل بعد التشغيل: \`VERIFIED\`
          - البوابة التالية: مراجعة ثانية مستقلة قبل \`REVIEWED\`.
          EOF
          git fetch origin main
          git show origin/main:.github/workflows/build-book.yml > .github/workflows/build-book.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CHAPTER_08_CI_VERIFICATION_2026-07-19.md .github/workflows/build-book.yml
          git commit -m 'ci(ch8): record verified canonical build'
          git push origin HEAD:agent/chapter-08-dirichlet-primes-v0.12.0
