name: Quality diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Repair vertical-tab escape corruption
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          for pattern in ('*.md', '*.tex'):
              for path in Path('.').rglob(pattern):
                  text = path.read_text(encoding='utf-8')
                  if '\x0b' not in text:
                      continue
                  path.write_text(text.replace('\x0b', r'\v'), encoding='utf-8')
                  changed.append(str(path))

          print('Repaired files:', changed)
          PY

          if git diff --quiet; then
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.md' '*.tex'
          git commit -m "fix: restore escaped LaTeX commands"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Run quality check and comment result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          python scripts/quality_check.py > quality-diagnostics.txt 2>&1
          {
            echo 'Temporary quality diagnostics:'
            echo
            echo '```text'
            cat quality-diagnostics.txt
            echo '```'
          } > quality-comment.md
          gh pr comment "$PR_NUMBER" --body-file quality-comment.md
          exit 0
