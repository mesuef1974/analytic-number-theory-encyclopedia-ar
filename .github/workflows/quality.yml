name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out Chapter 7 branch
        uses: actions/checkout@v4
        with:
          ref: agent/chapter-07-dirichlet-l-functions-v0.11.0
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply Chapter 7 review corrections
        run: python scripts/apply_ch7_review_corrections.py

      - name: Run repository quality checks
        run: python scripts/quality_check.py

      - name: Create build directory
        run: mkdir -p build

      - name: Compile corrected PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: manuscript/main.tex
          latexmk_use_xelatex: true
          args: >-
            -interaction=nonstopmode
            -halt-on-error
            -file-line-error
            -outdir=build
          os: debian

      - name: Verify corrected PDF
        shell: bash
        run: |
          test -s build/main.pdf
          cp build/main.pdf build/analytic-number-theory-encyclopedia-preview.pdf
          sha256sum build/analytic-number-theory-encyclopedia-preview.pdf > build/analytic-number-theory-encyclopedia-preview.pdf.sha256
          {
            stat --printf='Size: %s bytes\n' build/main.pdf
            file build/main.pdf
          } | tee build/build-metadata.txt

      - name: Upload corrected PDF
        uses: actions/upload-artifact@v4
        with:
          name: chapter-07-corrected-preview
          path: |
            build/analytic-number-theory-encyclopedia-preview.pdf
            build/analytic-number-theory-encyclopedia-preview.pdf.sha256
            build/build-metadata.txt
          if-no-files-found: error
          retention-days: 30

      - name: Restore workflows and commit corrections
        shell: bash
        run: |
          cat > .github/workflows/quality.yml <<'YAML'
          name: Quality checks

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            quality:
              runs-on: ubuntu-latest
              steps:
                - name: Check out repository
                  uses: actions/checkout@v4

                - name: Set up Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"

                - name: Run repository quality checks
                  run: python scripts/quality_check.py
          YAML
          rm -f .github/workflows/ch7-apply-review-corrections.yml
          rm -f scripts/apply_ch7_review_corrections.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(chapter-07): apply external review corrections"
          git push origin HEAD:agent/chapter-07-dirichlet-l-functions-v0.11.0
