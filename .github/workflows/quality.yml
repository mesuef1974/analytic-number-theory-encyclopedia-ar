name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out Chapter 7 branch
        uses: actions/checkout@v4
        with:
          ref: agent/chapter-07-dirichlet-l-functions-v0.11.0
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply all recorded review corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          batch2 = "volumes/volume-01-foundations/chapters/chapter-07-dirichlet-l-functions-batch-02.tex"
          batch4 = "volumes/volume-01-foundations/chapters/chapter-07-dirichlet-l-functions-batch-04.tex"
          batch5 = "volumes/volume-01-foundations/chapters/chapter-07-dirichlet-l-functions-batch-05.tex"

          replace_once(batch2, "هذه الت合同 متوافقة", "وهذه التوافقات متّسقة")

          old_fe = r'''تتناقص \(\theta_\chi(t)\) أسيًا عندما \(t\to\infty\). ويحول تحويل
ثيتا سلوكها عند \(t\to0^+\) إلى سلوك
\(\theta_{\overline\chi}(1/t)\) عند اللانهاية، ولذلك يتقارب التكامل
محليًا بانتظام لكل \(s\in\mathbb C\)، ويعرف دالة تامة.

وباستخدام تحويل ثيتا ثم تغيير المتغير \(u=1/t\):
\begin{align*}
\Lambda(s,\chi)
&=
\frac{\varepsilon_\chi}{2}
\int_0^\infty
\theta_{\overline\chi}(1/t)
 t^{(s-a-1)/2}\,\frac{dt}{t}\\
&=
\frac{\varepsilon_\chi}{2}
\int_0^\infty
\theta_{\overline\chi}(u)
 u^{(1-s+a)/2}\,\frac{du}{u}\\
&=
\varepsilon_\chi\Lambda(1-s,\overline\chi).
\end{align*}'''
          new_fe = r'''نقسم التكامل عند \(t=1\). وفي الجزء \(0<t<1\) نستعمل تحويل
ثيتا ثم نغيّر المتغير \(u=1/t\)، فنحصل على
\begin{align*}
\Lambda(s,\chi)
&=
\frac12\int_1^\infty
\theta_\chi(t)t^{(s+a)/2}\,\frac{dt}{t}\\
&\quad+
\frac{\varepsilon_\chi}{2}\int_1^\infty
\theta_{\overline\chi}(u)u^{(1-s+a)/2}\,\frac{du}{u}.
\end{align*}
يتقارب التكاملان محليًا بانتظام لكل \(s\in\mathbb C\)، بسبب التناقص
الأسي لدالتي ثيتا عند اللانهاية، ولذلك تمثل الصيغة دالة تامة.

وبتطبيق الصيغة نفسها على \(\Lambda(1-s,\overline\chi)\)، ثم استعمال
\[
\varepsilon_\chi\varepsilon_{\overline\chi}
=
\frac{\tau(\chi)\tau(\overline\chi)}{i^{2a}q}
=
\frac{\chi(-1)q}{(-1)^a q}
=1,
\]
نجد أن الحدين يتبادلان، ومن ثم
\[
\Lambda(s,\chi)
=
\varepsilon_\chi\Lambda(1-s,\overline\chi).
\]'''
          replace_once(batch2, old_fe, new_fe)

          old_cor = r'''\begin{corollary}
إذا كانت \(\chi\) غير حقيقية، فإن الصفر البديهي عند \(s=0\) في الحالة
الزوجية بسيط، لأن المعادلة الوظيفية تربطه بقيمة
\(L(1,\overline\chi)\ne0\).
\end{corollary}'''
          new_cor = r'''\begin{remark}[بساطة الصفر عند الصفر في الحالة غير الحقيقية]
إذا كانت \(\chi\) غير حقيقية وزوجية، فإن الصفر البديهي عند \(s=0\)
بسيط، لأن المعادلة الوظيفية تربطه بقيمة
\(L(1,\overline\chi)\ne0\). وهذه حالة خاصة من النتيجة العامة
\ref{cor:dirichlet-l-trivial-zeros}، وليست نتيجة مستقلة تحتاج إلى معرّف
إضافي.
\end{remark}'''
          replace_once(batch4, old_cor, new_cor)

          old_eta = r'''ثبت عددًا حقيقيًا \(c>\sigma_0\). لكل \(k\geq0\) واختر
\(\eta>0\) بحيث \(c-\eta>\sigma_0\). لدينا التقدير القياسي'''
          new_eta = r'''ثبت عددًا حقيقيًا \(c>\sigma_0\)، ثم ثبت عددًا
\(\eta>0\) بحيث \(c-\eta>\sigma_0\). عندئذ، لكل \(k\geq0\)، لدينا
التقدير القياسي'''
          replace_once(batch5, old_eta, new_eta)

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "### تغيّر\n"
          bullet = "- تطبيق تصحيحات المراجعة الخارجية الآلية للفصل السابع: إزالة محرفي CJK المتسربين، وتقسيم تكامل ميلين عند \\(t=1\\)، وتثبيت اختيار \\(\\eta\\) في مبدأ لاندو، وتحويل نتيجة مكررة إلى ملاحظة تحيل إلى `ANT-COR-07-05`.\n"
          if bullet not in text:
              if marker not in text:
                  raise SystemExit("CHANGELOG marker not found")
              changelog.write_text(text.replace(marker, marker + bullet, 1), encoding="utf-8")

          progress = Path("docs/PROGRESS.md")
          text = progress.read_text(encoding="utf-8")
          marker = "- إغلاق النتيجة العامة `ANT-THM-07-09` بحالة `PROVED-HERE`.\n"
          bullet = "- إغلاق تصحيحات المراجعة الخارجية الآلية وإزالة المحارف غير العربية من مصدر الفصل.\n"
          if bullet not in text:
              if marker not in text:
                  raise SystemExit("PROGRESS marker not found")
              text = text.replace(marker, marker + bullet, 1)
          text = text.replace("- تدقيق مستقل كامل للصيغ وعوامل غاما وجذور العدد.\n", "- المراجعة البشرية المستقلة النهائية للصيغ وعوامل غاما وجذور العدد.\n", 1)
          progress.write_text(text, encoding="utf-8")

          Path("docs/CHAPTER_07_EXTERNAL_AI_REVIEW_CORRECTIONS_2026-07-19.md").write_text(r'''# إغلاق تصحيحات المراجعة الخارجية الآلية للفصل السابع

التاريخ: 2026-07-19

الحالة: `PASS-WITH-MINOR-CORRECTIONS / CORRECTIONS-CLOSED`

## التصحيحات المنفذة

1. إزالة المحرفين الصينيين `合同` واستبدالهما بصياغة عربية سليمة.
2. تقسيم تكامل ميلين عند \(t=1\) في برهان المعادلة الوظيفية.
3. تثبيت \(\eta\) قبل استعمال التقدير اللوغاريتمي في مبدأ لاندو.
4. تحويل النتيجة المكررة عن بساطة الصفر عند \(s=0\) إلى ملاحظة تحيل إلى `ANT-COR-07-05`.
5. تحديث سجل التغييرات ولوحة التقدم.

لا تعد هذه مراجعة بشرية مستقلة؛ لذلك تبقى حالة الفصل `DRAFT`.
''', encoding="utf-8")

          offenders = []
          for p in Path("volumes/volume-01-foundations/chapters").glob("chapter-07*.tex"):
              for index, char in enumerate(p.read_text(encoding="utf-8")):
                  if "\u4e00" <= char <= "\u9fff":
                      offenders.append((str(p), index, char))
          if offenders:
              raise SystemExit(f"CJK characters remain: {offenders}")
          PY

      - name: Run repository quality checks
        run: python scripts/quality_check.py

      - name: Create build directory
        run: mkdir -p build

      - name: Compile corrected PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: manuscript/main.tex
          latexmk_use_xelatex: true
          args: >-
            -interaction=nonstopmode
            -halt-on-error
            -file-line-error
            -outdir=build
          os: debian

      - name: Verify corrected PDF
        shell: bash
        run: |
          test -s build/main.pdf
          cp build/main.pdf build/analytic-number-theory-encyclopedia-preview.pdf
          sha256sum build/analytic-number-theory-encyclopedia-preview.pdf > build/analytic-number-theory-encyclopedia-preview.pdf.sha256
          pdfinfo build/main.pdf | tee build/pdfinfo.txt
          grep -Eq '^Pages:[[:space:]]+130$' build/pdfinfo.txt

      - name: Upload corrected PDF
        uses: actions/upload-artifact@v4
        with:
          name: chapter-07-corrected-preview
          path: |
            build/analytic-number-theory-encyclopedia-preview.pdf
            build/analytic-number-theory-encyclopedia-preview.pdf.sha256
            build/pdfinfo.txt
          if-no-files-found: error
          retention-days: 30

      - name: Restore workflows and commit corrections
        shell: bash
        run: |
          cat > .github/workflows/quality.yml <<'YAML'
          name: Quality checks

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            quality:
              runs-on: ubuntu-latest
              steps:
                - name: Check out repository
                  uses: actions/checkout@v4

                - name: Set up Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"

                - name: Run repository quality checks
                  run: python scripts/quality_check.py
          YAML
          rm -f .github/workflows/ch7-apply-review-corrections.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(chapter-07): apply external review corrections"
          git push origin HEAD:agent/chapter-07-dirichlet-l-functions-v0.11.0
