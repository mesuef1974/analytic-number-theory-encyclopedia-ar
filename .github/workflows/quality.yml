name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run diagnostic quality checks
        shell: bash
        run: |
          set +e
          python3 scripts/quality_check.py > quality-output.txt 2>&1
          status=$?
          echo "QUALITY_EXIT_CODE=$status" >> quality-output.txt
          exit 0

      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: chapter-11-quality-diagnostic
          path: quality-output.txt
          if-no-files-found: error
