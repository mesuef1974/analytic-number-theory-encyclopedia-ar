```'''
          replace_section('docs/TODO.md', '### الفصل الثالث عشر — مبرهنة Bombieri--Vinogradov', '## قريب', todo)

          version = r'''# الإصدار الحالي

```text
0.17.0-dev
```

هذا الملف هو **المصدر الوحيد المعتمد لرقم الإصدار**. تُحدَّث النسخ المكررة في بقية الملفات بواسطة:

```powershell
.\scripts\sync-version.ps1
```

## معنى رقم الإصدار

- الرقم الأول: إصدار موسوعي رئيسي.
- الرقم الثاني: مرحلة علمية كبيرة أو فصل رئيسي.
- الرقم الثالث: تحديث تحريري أو تقني.
- اللاحقة `dev`: النسخة لا تزال قيد التطوير ولم تُعتمد للنشر.

## المرحلة الحالية

تستهدف `0.17.0-dev` الفصل الثالث عشر:

**مبرهنة Bombieri--Vinogradov والتوزيع المتوسطي للأعداد الأولية في المتتاليات الحسابية.**

```text
BASE-MAIN              = 607c6f8ad76f8085828f49ce6b566c846950ab2a
BRANCH                 = agent/chapter-13-bombieri-vinogradov-v0.17.0
CHAPTER-13             = VERIFIED
PRE-AUTHORING-GATE     = CLOSED / PASS
POST-AUTHORING-AUDIT   = PASS
LOGIC-AUDIT            = PASS
REFERENCE-VERIFICATION = PASS
RESULTS                = 11
QUALITY-CHECKS         = RUN-340 / SUCCESS
PDF-BUILD              = RUN-334 / SUCCESS
INDEPENDENT-REVIEW     = NOT YET STARTED
PR-22                  = DRAFT / UNMERGED
MERGE                  = NOT AUTHORIZED
RELEASE-READY          = NO
```

## النتيجة المركزية

لكل `A>0`، إذا

```text
Q <= x^(1/2) / (log x)^(A+3),
```

فإن متوسط أكبر خطأ في `psi(y;q,a)` على `q<=Q` والفئات المختزلة و`y<=x` هو من رتبة `x/(log x)^A`.

الثابت العام غير فعال بسبب استعمال Siegel--Walfisz للموصلات الصغيرة. لا يدعي الفصل Elliott--Halberstam أو مستوى توزيع عامًا أكبر من `1/2`.

## المرحلة السابقة

```text
CHAPTER-12          = REVIEWED / MERGED
PR-20               = MERGED
GOVERNANCE-PR-21    = MERGED
GOVERNANCE-MERGE    = 607c6f8ad76f8085828f49ce6b566c846950ab2a
LOCAL-SOURCE-BUILD  = PASS / 184 PAGES
RELEASE-READY       = NO
```
'''
          Path('docs/VERSION.md').write_text(version, encoding='utf-8')

          p = Path('CHANGELOG.md')
          text = p.read_text(encoding='utf-8')
          additions = '- إضافة متن الفصل الثالث عشر كاملًا عن مبرهنة Bombieri--Vinogradov وربطه بالكتاب.\n- إضافة أحد عشر نتيجة للفصل الثالث عشر، منها حزمة غربال كبير مقتبسة وعشر نتائج داخلية.\n- إضافة التدقيق المنطقي والمرجعي وتدقيق ما بعد التأليف للفصل الثالث عشر بأحكام `PASS`.\n'
          if 'إضافة متن الفصل الثالث عشر كاملًا' not in text:
              text = text.replace('### أضيف\n', '### أضيف\n' + additions, 1)
          changes = '- رفع الفصل الثالث عشر إلى `VERIFIED` بعد نجاح Quality #340 وبناء PDF #334.\n- تثبيت الخسارة اللوغاريتمية `A+3` وعدم فعالية الثابت العام في المسار المعتمد.\n- نقل نتائج الفصل الثالث عشر إلى سجل نشط وإزالة Bombieri--Vinogradov من قائمة النتائج المؤجلة.\n'
          if 'رفع الفصل الثالث عشر إلى `VERIFIED`' not in text:
              text = text.replace('### تغيّر\n', '### تغيّر\n' + changes, 1)
          p.write_text(text, encoding='utf-8')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ROADMAP.md docs/TODO.md docs/VERSION.md CHANGELOG.md
          git commit -m "Synchronize Chapter 13 VERIFIED governance [skip chapter13-governance]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
