name: Zeta numerical validation

on:
  push:
    branches: [main]
    paths:
      - "computational/python/**"
      - ".github/workflows/zeta-experiment.yml"
  pull_request:
    branches: [main]
    paths:
      - "computational/python/**"
      - ".github/workflows/zeta-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardy-z-low-height:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: computational/python/requirements-zeta.txt

      - name: Install pinned dependency
        run: python -m pip install -r computational/python/requirements-zeta.txt

      - name: Run registered validation
        run: python computational/python/hardy_z_low_zeros.py --config computational/python/config/hardy_z_first10.json

      - name: Upload validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: hardy-z-low-height
          path: |
            computational/python/outputs/hardy_z_first10.csv
            computational/python/outputs/hardy_z_first10.summary.json
          if-no-files-found: error
          retention-days: 14
